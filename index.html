<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tikkle</title>
<style>
@font-face { font-family: Nunito; src: url("fonts/Nunito.ttf") format("truetype"); font-weight: 200 1000; }
:root { color-scheme: light dark; --page: #f4f3f0; --ink: #27362f; --mute: #55544f; --line: #e6e4e0; }
@media (prefers-color-scheme: dark) { :root { --page: #101713; --ink: #e6e4e1; --mute: #b2b4a8; --line: #2f3b35; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 17px/1.55 Nunito, system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 40px 16px 56px; }
h1, h2 { font-family: Nunito, system-ui, sans-serif; font-weight: 800; line-height: 1.2; }
h1 { font-size: 32px; margin: 0 0 8px; }
h2 { font-size: 21px; margin: 32px 0 8px; }
p, li { margin: 0 0 10px; }
ul, ol { padding-left: 22px; margin: 0 0 10px; }
a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
strong { font-weight: 700; }
nav { margin: 0 0 24px; font-weight: 600; }
nav a { display: inline-block; min-height: 44px; line-height: 44px; margin-right: 16px; }
.lead { color: var(--mute); }
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--mute); font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>Tikkle</h1>
<p class="lead">A budget for two people who run one home.</p>
<ul>
<li><a href="privacy/">Privacy notice</a></li>
<li><a href="support/">Help and contact</a></li>
</ul>
<footer>Tikkle · <a href="mailto:tikkle.app@icloud.com">tikkle.app@icloud.com</a></footer>
</main>
</body>
</html>
